[project]
name = "kinderbuch-bildlabor"
version = "0.1.0"
description = "Erschließung und Qualitätsprüfung historischer Kinderbuch-Illustrationen (Prototyp)"
authors = [
    { name = "Shota Tsertsvadze" }
]
requires-python = ">=3.13"
dependencies = [
    "pillow>=13.0.0",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest>=9.2.0",
    "ruff==0.17.4",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
files = ["app.py", "src/kinderbuch_bildlabor"]
check_untyped_defs = true

[tool.uv.exclude-newer-package]
ruff = "2026-11-07"
mypy = "2026-11-07"
streamlit = "2026-11-07"
