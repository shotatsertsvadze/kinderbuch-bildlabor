# Lokale Demo: nur auf diesem Rechner erreichbar, keine Nutzungsstatistik an Streamlit
[server]
address = "localhost"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#0D655B"
backgroundColor = "#F2F7F6"
secondaryBackgroundColor = "#E4EFEE"
textColor = "#17333C"
borderColor = "#C3D9D6"
font = "sans-serif"
headingFont = "serif"
baseFontSize = 16
baseRadius = "0.65rem"
