name: Windows-Abnahme
on:
  push:
    branches: [windows-abnahme]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Umgebung festhalten
        run: |
          Get-ComputerInfo -Property OsName,OsVersion,OsBuildNumber,WindowsVersion | Format-List
          "Edge: " + (Get-Item "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
          "PowerShell: " + $PSVersionTable.PSVersion
          "uv vorinstalliert: " + [bool](Get-Command uv -ErrorAction SilentlyContinue)
      - name: Übergabe-ZIP prüfen und in Pfad mit Leerzeichen und Umlaut entpacken
        run: |
          $hash = (Get-FileHash ci-windows\kinderbuch-bildlabor.zip -Algorithm SHA256).Hash.ToLower()
          $expected = (Get-Content ci-windows\expected.sha256).Trim()
          "ZIP SHA-256: $hash"
          if ($hash -ne $expected) { throw "Prüfsumme weicht ab, erwartet $expected" }
          $target = Join-Path $env:USERPROFILE "Prüfung Bildlabor ä"
          Expand-Archive ci-windows\kinderbuch-bildlabor.zip -DestinationPath $target
          "PKG=$target\kinderbuch-bildlabor" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: uv wie im README installieren
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          "$env:USERPROFILE\.local\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Einrichten und Qualitätsprüfungen wie im README
        working-directory: ${{ env.PKG }}
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item Env:UV_EXCLUDE_NEWER -ErrorAction SilentlyContinue
          uv --version
          uv sync --locked
          uv run --locked ruff check --no-cache .
          uv run --locked ruff format --check --no-cache .
          uv run --locked mypy --cache-dir=/dev/null
          uv run --locked python -B -m pytest -p no:cacheprovider -q
          "dev\null angelegt: " + (Test-Path "$((Get-Location).Drive.Root)dev\null")
      - name: App nach README starten (PowerShell, eigener Datenordner)
        working-directory: ${{ env.PKG }}
        run: |
          $env:BILDLABOR_DATA_DIR = "$env:TEMP\bildlabor-probe"
          "BILDLABOR_DATA_DIR=$env:BILDLABOR_DATA_DIR" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Start-Process uv -ArgumentList "run","streamlit","run","app.py" -RedirectStandardOutput "$env:RUNNER_TEMP\app1.out" -RedirectStandardError "$env:RUNNER_TEMP\app1.err"
          for ($i = 0; $i -lt 90; $i++) { if (Test-NetConnection localhost -Port 8501 -InformationLevel Quiet -WarningAction SilentlyContinue) { break }; Start-Sleep 2 }
          Get-Content "$env:RUNNER_TEMP\app1.out"
          if (-not (Test-NetConnection localhost -Port 8501 -InformationLevel Quiet)) { Get-Content "$env:RUNNER_TEMP\app1.err"; throw "App nicht erreichbar" }
          Start-Sleep 5
          "Edge-Prozesse nach App-Start: " + @(Get-Process msedge -ErrorAction SilentlyContinue).Count
          Get-CimInstance Win32_Process -Filter "Name='msedge.exe'" | Select-Object -First 3 ProcessId, ParentProcessId, CommandLine | Format-List
      - name: Diagnose – startet danach noch ein einfacher Prozess?
        shell: cmd
        run: ver
      - name: Browser-Ablauf Scan 22 in Edge
        run: uv run --no-project --with playwright ci-windows\win_e2e.py flow http://localhost:8501 "$env:PKG" "$env:BILDLABOR_DATA_DIR" "$env:RUNNER_TEMP\e2e" msedge
      - name: Server neu starten
        working-directory: ${{ env.PKG }}
        run: |
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*streamlit*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Start-Sleep 3
          Start-Process uv -ArgumentList "run","streamlit","run","app.py" -RedirectStandardOutput "$env:RUNNER_TEMP\app2.out" -RedirectStandardError "$env:RUNNER_TEMP\app2.err"
          for ($i = 0; $i -lt 90; $i++) { if (Test-NetConnection localhost -Port 8501 -InformationLevel Quiet -WarningAction SilentlyContinue) { break }; Start-Sleep 2 }
      - name: Nach Neustart prüfen (Persistenz, JSON, CSV)
        run: uv run --no-project --with playwright ci-windows\win_e2e.py after_restart http://localhost:8501 "$env:PKG" "$env:BILDLABOR_DATA_DIR" "$env:RUNNER_TEMP\e2e" msedge
      - name: Belege sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-abnahme
          path: |
            ${{ runner.temp }}/e2e
            ${{ runner.temp }}/app*.out
            ${{ runner.temp }}/app*.err
            ${{ env.BILDLABOR_DATA_DIR }}
