# --- Gemeinsame Gestaltung (beide Modi) -------------------------------------------------------
[theme]
font = "IBM Plex Sans, system-ui, sans-serif"
headingFont = "Newsreader, Georgia, serif"
codeFont = "IBM Plex Mono, ui-monospace, monospace"
baseFontSize = 16
headingFontSizes = ["2.5rem", "1.75rem", "1.375rem", "1.125rem", "1rem", "0.875rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
codeFontSize = "0.875em"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
paddingTop = "2.5rem"
linkUnderline = true
showSidebarBorder = true

