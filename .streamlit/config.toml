# Lokale Demo: nur auf diesem Rechner erreichbar, keine Nutzungsstatistik an Streamlit
[server]
address = "localhost"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Gestaltung an einer Stelle. Farben folgen bewusst dem hellen/dunklen Standard von Streamlit;
# die Markierungsfarben der Bildregionen stehen in regions.py.
[theme]
font = "sans-serif"
baseFontSize = 16
baseRadius = "0.5rem"
