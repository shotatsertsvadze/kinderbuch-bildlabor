[project]
name = "kinderbuch-bildlabor"
version = "0.1.0"
description = "Erschließung und Qualitätsprüfung historischer Kinderbuch-Illustrationen (Prototyp)"
authors = [
    { name = "Shota Tsertsvadze", email = "shottsertsvadze@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pillow>=13.0.0",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
