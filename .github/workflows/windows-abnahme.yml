name: Windows-Abnahme
on:
  push:
    branches: [windows-abnahme]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Umgebung festhalten
        run: |
          Get-ComputerInfo -Property OsName,OsVersion,OsBuildNumber,WindowsVersion | Format-List
          "Edge: " + (Get-Item "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
          "PowerShell: " + $PSVersionTable.PSVersion
          "uv vorinstalliert: " + [bool](Get-Command uv -ErrorAction SilentlyContinue)
      - name: Übergabe-ZIP prüfen und in Pfad mit Leerzeichen und Umlaut entpacken
        run: |
          $hash = (Get-FileHash ci-windows\kinderbuch-bildlabor.zip -Algorithm SHA256).Hash.ToLower()
          $expected = (Get-Content ci-windows\expected.sha256).Trim()
          "ZIP SHA-256: $hash"
          if ($hash -ne $expected) { throw "Prüfsumme weicht ab, erwartet $expected" }
          $target = Join-Path $env:USERPROFILE "Prüfung Bildlabor ä"
          Expand-Archive ci-windows\kinderbuch-bildlabor.zip -DestinationPath $target
          "PKG=$target\kinderbuch-bildlabor" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: uv wie im README installieren
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          "$env:USERPROFILE\.local\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Einrichten und Qualitätsprüfungen wie im README
        working-directory: ${{ env.PKG }}
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item Env:UV_EXCLUDE_NEWER -ErrorAction SilentlyContinue
          uv --version
          uv sync --locked
          uv run --locked ruff check --no-cache .
          uv run --locked ruff format --check --no-cache .
          uv run --locked mypy
          uv run --locked python -B -m pytest -p no:cacheprovider -q
          $devnull = Test-Path "$((Get-Location).Drive.Root)dev\null"
          "dev\null angelegt: $devnull"
          ".mypy_cache\.gitignore vorhanden: " + (Test-Path ".mypy_cache\.gitignore")
          if ($devnull -or -not (Test-Path ".mypy_cache\.gitignore")) { throw "mypy-Zwischenspeicher nicht wie in der README beschrieben" }
      # Ein Schritt: Der Windows-Runner beendet am Schrittende alle darin gestarteten Prozesse
      # (belegt: im folgenden Schritt lauschte nichts mehr auf Port 8501).
      - name: App starten, Browser-Ablauf in Edge, Serverneustart, Prüfung nach Neustart
        working-directory: ${{ env.PKG }}
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $true
          $env:BILDLABOR_DATA_DIR = "$env:TEMP\bildlabor-probe"
          "BILDLABOR_DATA_DIR=$env:BILDLABOR_DATA_DIR" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          function Start-App($n) {
            # Runner ohne Bedienoberfläche: kein automatisch geöffnetes Edge (belegt: sonst 10 Edge-Prozesse in der Dienstsitzung)
            Start-Process uv -ArgumentList "run","streamlit","run","app.py","--server.headless","true" -RedirectStandardOutput "$env:RUNNER_TEMP\app$n.out" -RedirectStandardError "$env:RUNNER_TEMP\app$n.err"
            for ($i = 0; $i -lt 90; $i++) { if (Test-NetConnection 127.0.0.1 -Port 8501 -InformationLevel Quiet -WarningAction SilentlyContinue) { break }; Start-Sleep 2 }
            if (-not (Test-NetConnection 127.0.0.1 -Port 8501 -InformationLevel Quiet -WarningAction SilentlyContinue)) { Get-Content "$env:RUNNER_TEMP\app$n.err"; throw "App nicht erreichbar" }
            Get-Content "$env:RUNNER_TEMP\app$n.out"
          }
          Start-App 1
          uv run --no-project --with playwright "$env:GITHUB_WORKSPACE\ci-windows\win_e2e.py" flow http://localhost:8501 "$env:PKG" "$env:BILDLABOR_DATA_DIR" "$env:RUNNER_TEMP\e2e" msedge
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*streamlit*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep 3
          "Port 8501 nach dem Beenden frei: " + (-not (Test-NetConnection 127.0.0.1 -Port 8501 -InformationLevel Quiet -WarningAction SilentlyContinue))
          Start-App 2
          uv run --no-project --with playwright "$env:GITHUB_WORKSPACE\ci-windows\win_e2e.py" after_restart http://localhost:8501 "$env:PKG" "$env:BILDLABOR_DATA_DIR" "$env:RUNNER_TEMP\e2e" msedge
      - name: Belege zusammenführen
        if: always()
        run: |
          if ($env:BILDLABOR_DATA_DIR -and (Test-Path $env:BILDLABOR_DATA_DIR)) { Copy-Item $env:BILDLABOR_DATA_DIR "$env:RUNNER_TEMP\daten" -Recurse }
      - name: Belege sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-abnahme
          path: |
            ${{ runner.temp }}/e2e
            ${{ runner.temp }}/app*.out
            ${{ runner.temp }}/app*.err
            ${{ runner.temp }}/daten
