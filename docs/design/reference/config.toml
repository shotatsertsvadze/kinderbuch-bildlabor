# --- Gemeinsame Gestaltung (beide Modi) -------------------------------------------------------
[theme]
font = "Geist, system-ui, sans-serif"
headingFont = "Bricolage Grotesque, Geist, system-ui, sans-serif"
codeFont = "Geist Mono, ui-monospace, monospace"
baseFontSize = 16
headingFontSizes = ["2.5rem", "1.625rem", "1.25rem", "1.0625rem", "1rem", "0.875rem"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
codeFontSize = "0.875em"
baseRadius = "0.625rem"
buttonRadius = "0.625rem"
paddingTop = "2.5rem"
linkUnderline = true
showSidebarBorder = true

