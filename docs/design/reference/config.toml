# Lokale Demo: nur auf diesem Rechner erreichbar, keine Nutzungsstatistik an Streamlit
[server]
address = "localhost"
# Ohne diese Zeile wartet der erste Start im Terminal auf eine E-Mail-Eingabe
showEmailPrompt = false
# Schriften liegen lokal unter static/fonts/: die Anwendung bleibt offline lauffähig
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Lesesaal 2: Papierton als Grund, dunkle Tinte als Schrift, Berliner Blau nur für die nächste Handlung.
# Token-Quelle: docs/design/DESIGN_SYSTEM.md. Farben hier und in workflow.css gemeinsam ändern.

