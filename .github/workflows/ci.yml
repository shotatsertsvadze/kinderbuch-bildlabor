name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Build package
        run: uv build
      - name: Lint
        run: uv run --locked ruff check --no-cache .
      - name: Format check
        run: uv run --locked ruff format --check --no-cache .
      - name: Type check
        run: uv run --locked mypy --cache-dir=/dev/null
      - name: Test
        run: uv run --locked pytest
