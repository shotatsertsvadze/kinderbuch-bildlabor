# Lokale Demo: nur auf diesem Rechner erreichbar, keine Nutzungsstatistik an Streamlit
[server]
address = "localhost"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Lesesaal: Papierton als Grund, dunkle Tinte als Schrift, Berliner Blau nur für die nächste Handlung
[theme]
base = "light"
primaryColor = "#1F4E79"
backgroundColor = "#F7F3EB"
secondaryBackgroundColor = "#EFE7D8"
textColor = "#1E2230"
borderColor = "#DCD1BD"
font = "sans-serif"
headingFont = "serif"
baseFontSize = 16
baseRadius = "0.5rem"

[theme.sidebar]
backgroundColor = "#EFE7D8"
